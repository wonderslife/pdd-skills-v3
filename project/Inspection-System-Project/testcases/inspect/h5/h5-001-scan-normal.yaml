# 机房巡检系统 - H5 扫码巡检（全正常）完整闭环
#
# 用途: 验证「手机 H5 扫码 → 解析点位 → 逐项判定 → 提交 → PC 后台可见」主链路
# 前置: 点位已配置巡检项（pc-005），且本周期内未巡检过（否则会被服务端拒绝）
# 扫码: H5 的 uni.scanCode 在浏览器中不可用，本用例走「手动输入点位编码」通道，
#       与扫码共用同一个 resolve 接口，业务等价

test_id: "INSP-H5-001-scan-normal"
title: "H5 扫码巡检：解析点位、逐项正常判定、提交成功"
priority: "P0"
tags: ["H5", "扫码巡检", "闭环", "冒烟"]
author: "testcase-modeler (机房巡检系统)"

context_check:
  login_url: "${H5_URL}/#/pages/login/index"
  home_indicator: "扫码巡检"
  credentials:
    username: "${H5_USER}"
    password: "${H5_PASS}"
  captcha_required: false

steps:
  - step: 1
    desc: "打开 H5 登录页"
    action: navigate
    url: "${H5_URL}/#/pages/login/index"
    wait_after:
      type: time
      duration: 2500
    assertions:
      - type: text_contains
        expected: "登 录"
        confidence: medium

  - step: 2
    desc: "输入账号"
    action: fill
    target: "请输入账号"
    locator:
      uid_cache_key: "h5_username"
    value: "${H5_USER}"
    assertions:
      - type: field_filled
        expected: "字段已填写"

  - step: 3
    desc: "输入密码"
    action: fill
    target: "请输入密码"
    locator:
      uid_cache_key: "h5_password"
    value: "${H5_PASS}"
    assertions:
      - type: field_filled
        expected: "字段已填写"

  - step: 4
    desc: "点击「登 录」"
    action: click
    target: "登 录"
    wait_after:
      type: time
      duration: 3000
    assertions:
      - type: network_called
        url_pattern: "*/login"
        method: POST
        response_code: 200
        confidence: high

  - step: 5
    desc: "进入「扫码巡检」页"
    action: navigate
    url: "${H5_URL}/#/pages/inspect/scan"
    wait_after:
      type: time
      duration: 2500
    assertions:
      - type: text_contains
        expected: "扫码巡检"
        confidence: high
      - type: element_visible
        target: "扫一扫"
        confidence: high

  - step: 6
    desc: "在「二维码磨损？手动输入点位编码」输入框中填入点位编码（等价扫码）"
    action: fill
    target: "例如 RM-A-001"
    value: "${POINT_CODE}"
    assertions:
      - type: field_filled
        expected: "字段已填写"

  - step: 7
    desc: "点击「查询」，调用扫码解析接口"
    action: click
    target: "查询"
    wait_after:
      type: time
      duration: 3000
    assertions:
      - type: network_called
        url_pattern: "*/inspect/scan/resolve*"
        method: POST
        response_code: 200
        response_body_contains:
          - '"code":200'
        confidence: high

  - step: 8
    desc: "验证跳转到「巡检执行」页，且点位信息卡显示点位名称/编码/机房/周期"
    action: assert_multiple
    assertions:
      - type: text_contains
        expected: "${POINT_NAME}"
        confidence: high
      - type: text_contains
        expected: "${POINT_CODE}"
        confidence: medium
      - type: text_contains
        expected: "上次巡检"
        confidence: medium

  - step: 9
    desc: "断言未出现「本周期已巡检」告警（若出现说明测试点位需换一个或清理上周期记录）"
    action: assert_multiple
    assertions:
      - type: element_hidden
        target: "本周期已巡检"
        confidence: high

  - step: 10
    desc: "为第 1 个巡检项选择「正常」"
    action: click
    target: "正常"
    wait_after:
      type: time
      duration: 500
    assertions:
      - type: element_visible
        target: "已填"
        confidence: low

  - step: 11
    desc: "为第 2 个巡检项选择「正常」（若该点位仅 1 项，此步可跳过）"
    action: click
    target: "正常"
    wait_after:
      type: time
      duration: 500
    assertions:
      - type: element_visible
        target: "已填"
        confidence: low

  - step: 12
    desc: "填写「整体备注」"
    action: fill
    target: "本点位整体情况说明"
    value: "${H5_OVERALL_REMARK}"
    assertions:
      - type: field_filled
        expected: "字段已填写"

  - step: 13
    desc: "点击「提交巡检」"
    action: click
    target: "提交巡检"
    wait_after:
      type: time
      duration: 3500
    assertions:
      - type: network_called
        url_pattern: "*/inspect/record/submit*"
        method: POST
        response_code: 200
        response_body_contains:
          - '"code":200'
        confidence: high
      - type: toast_visible
        expected: "巡检记录已提交"
        confidence: high

  - step: 14
    desc: "点击「我的记录」，验证刚提交的记录出现在列表中"
    action: click
    target: "我的记录"
    wait_after:
      type: time
      duration: 2500
    assertions:
      - type: network_called
        url_pattern: "*/inspect/record/my*"
        method: GET
        response_code: 200
        confidence: medium
      - type: text_contains
        expected: "${POINT_NAME}"
        confidence: high

teardown:
  - action: screenshot
    name: "h5-scan-normal-{timestamp}.png"
    fullPage: true
  - action: log
    message: "该记录将作为 PC 端 pc-008 / pc-011 用例的数据来源"

metadata:
  created_by: "testcase-modeler v2.0.1"
  test_environment: "local"
  browser: "chromium (移动视图 390x844)"
  estimated_duration: "60-90s"
  risk_level: "high"
  note: "risk_level=high：本用例会写入一条巡检记录，并锁定该点位本周期；重跑前需清理或更换点位"
