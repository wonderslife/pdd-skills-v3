# 预售商品管理 - 后台新增预售商品正常流程
# 对应功能点: F-101 预售商品管理
# 前置: 无（包含登录步骤）
# 测试数据: 全部通过 ${ENV_VAR} 从 PRESALE-100-goods-create.env 注入（Iron Rule 5）

test_id: "PRESALE-100-goods-create"
title: "后台新增预售商品"
priority: "P0"
tags: ["预售", "商品管理", "后台新增", "正常路径", "E2E"]
author: "PDD Testcase Modeler"

# 前置状态感知（Iron Rule 1：已登录则自动跳过登录步骤）
context_check:
  login_url: "${BASE_URL}/login"
  home_indicator: "首页"
  credentials:
    username: "${TEST_USER}"
    password: "${TEST_PASS}"
    display_name: "${TEST_DISPLAY_NAME}"
  captcha_required: false

steps:
  # ===== 登录流程（未登录时执行，已登录自动跳过）=====
  - step: 1
    desc: "打开登录页面"
    action: navigate
    url: "${BASE_URL}/login"
    assertion:
      type: text_contains
      expected: "登录"

  - step: 2
    desc: "输入用户名"
    action: fill
    target: "用户名"
    value: "${TEST_USER}"
    wait_after:
      type: time
      duration: 500

  - step: 3
    desc: "输入密码"
    action: fill
    target: "密码"
    value: "${TEST_PASS}"
    wait_after:
      type: time
      duration: 500

  - step: 4
    desc: "点击登录按钮"
    action: click
    target: "登 录"
    wait_after:
      type: time
      duration: 3000

  # ===== 业务主流程 =====
  - step: 5
    desc: "打开预售商品列表页"
    action: navigate
    url: "${BASE_URL}/presale/goods"
    assertion:
      type: text_contains
      expected: "预售商品"

  - step: 6
    desc: "点击新增按钮"
    action: click
    target: "新增"
    wait_after:
      type: time
      duration: 1000

  - step: 7
    desc: "等待新增弹窗渲染完成（弹窗渲染需时，过早操作会串位）"
    action: wait_for
    target: "商品标题"
    timeout_ms: 8000
    wait_after:
      type: time
      duration: 500

  - step: 8
    desc: "输入商品标题"
    action: fill
    target: "商品标题"
    value: "${GOODS_TITLE}"
    assertion:
      type: field_filled
      expected: true

  - step: 9
    desc: "输入定金金额"
    action: fill
    target: "定金金额"
    value: "${DEPOSIT_AMOUNT}"
    assertion:
      type: field_filled
      expected: true

  - step: 10
    desc: "输入尾款金额"
    action: fill
    target: "尾款金额"
    value: "${TAIL_AMOUNT}"
    assertion:
      type: field_filled
      expected: true

  - step: 11
    desc: "选择预售截止时间"
    action: el_date
    target: "预售截止时间"
    value: "${PRESALE_END_TIME}"
    wait_after:
      type: time
      duration: 800

  - step: 12
    desc: "输入限购数量"
    action: fill
    target: "限购数量"
    value: "${LIMIT_QUANTITY}"

  - step: 13
    desc: "输入库存"
    action: fill
    target: "库存"
    value: "${STOCK}"

  - step: 14
    desc: "提交表单"
    action: click
    target: "确 定"
    assertion:
      type: toast_visible
      expected: "新增成功"

  - step: 15
    desc: "校验新增接口调用成功（Iron Rule 4：UI+网络双重校验）"
    action: verify_network
    assertion:
      type: network_called
      url_pattern: "/api/presale/goods"
      method: POST
      response_code: 200

  - step: 16
    desc: "确认列表出现新商品"
    action: wait_for
    target: "${GOODS_TITLE}"
    timeout_ms: 5000
    assertion:
      type: text_contains
      expected: "${GOODS_TITLE}"

# 后置清理（Iron Rule 1：截图留档）
teardown:
  - action: screenshot
    name: "presale-100-goods-create-result.png"
