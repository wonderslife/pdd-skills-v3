# 尾款支付 - 买家支付尾款正常流程
# 对应功能点: F-103 尾款支付
# 前置: 预售已结束，订单处于待付尾款状态

test_id: "PRESALE-003-tail-pay"
title: "买家支付尾款订单进入待发货流程"
priority: "P0"
tags: ["预售", "尾款支付", "正常路径", "E2E"]
author: "PDD Testcase Modeler"

context_check:
  login_url: "${BASE_URL}/login"
  home_indicator: "首页"
  credentials:
    username: "${TEST_USER}"
    password: "${TEST_PASS}"
    display_name: "${TEST_DISPLAY_NAME}"
  captcha_required: false

steps:
  - step: 1
    desc: "进入待付尾款的预售订单"
    action: navigate
    url: "${BASE_URL}/presale/orders?status=pending_tail"
    assertion:
      type: element_visible
      expected: true

  - step: 2
    desc: "点击支付尾款"
    action: click
    target: "支付尾款"
    assertion:
      type: toast_visible
      expected: "支付成功"

  - step: 3
    desc: "校验尾款支付接口调用成功"
    action: verify_network
    assertion:
      type: network_called
      url_pattern: "/api/presale/orders/tail-pay"
      method: POST
      response_code: 200

  - step: 4
    desc: "确认订单状态更新为已支付（paid）"
    action: wait_for
    target: "已支付"
    timeout_ms: 5000
    assertion:
      type: text_contains
      expected: "已支付"

  - step: 5
    desc: "商家端发货"
    action: click
    target: "发货"
    assertion:
      type: toast_visible
      expected: "发货成功"

  - step: 6
    desc: "校验发货接口（铁律3：网络校验）"
    action: verify_network
    assertion:
      type: network_called
      url_pattern: "/api/presale/orders/ship"
      method: POST
      response_code: 200
