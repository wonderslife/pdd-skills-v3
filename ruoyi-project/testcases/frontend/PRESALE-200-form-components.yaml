# 全组件表单压测 - 覆盖 form.vue 的 16 类控件
# 目的: 检验 testcase-ai.py 对各种 Element Plus 组件的处理能力（找 bug）
# 前置: 无（含登录）；后端已启动；验证码已关闭

test_id: "PRESALE-200-form-components"
title: "预售商品新增-全组件表单控件压测"
priority: "P1"
tags: ["预售", "商品管理", "组件压测", "E2E"]
author: "PDD Testcase Modeler"

context_check:
  login_url: "${BASE_URL}/login"
  home_indicator: "首页"
  credentials:
    username: "${TEST_USER}"
    password: "${TEST_PASS}"
    display_name: "${TEST_DISPLAY_NAME}"
  captcha_required: false

steps:
  # ===== 登录 =====
  - step: 1
    desc: "打开登录页面"
    action: navigate
    url: "${BASE_URL}/login"
    assertion:
      type: text_contains
      expected: "登录"

  - step: 2
    desc: "输入用户名"
    action: fill
    target: "用户名"
    value: "${TEST_USER}"
    wait_after:
      type: time
      duration: 500

  - step: 3
    desc: "输入密码"
    action: fill
    target: "密码"
    value: "${TEST_PASS}"
    wait_after:
      type: time
      duration: 500

  - step: 4
    desc: "点击登录按钮"
    action: click
    target: "登 录"
    wait_after:
      type: time
      duration: 3000

  # ===== 进入新增弹窗 =====
  - step: 5
    desc: "打开预售商品列表页"
    action: navigate
    url: "${BASE_URL}/presale/goods"
    assertion:
      type: text_contains
      expected: "预售商品"

  - step: 6
    desc: "点击新增按钮"
    action: click
    target: "新增"
    wait_after:
      type: time
      duration: 1000

  - step: 7
    desc: "等待新增弹窗渲染完成"
    action: wait_for
    target: "商品标题"
    timeout_ms: 8000
    wait_after:
      type: time
      duration: 800

  # ===== 真实业务字段 =====
  - step: 8
    desc: "输入商品标题（el-input）"
    action: fill
    target: "商品标题"
    value: "${GOODS_TITLE}"

  - step: 9
    desc: "输入定金金额（el-input-number）"
    action: fill
    target: "定金金额"
    value: "${DEPOSIT_AMOUNT}"

  - step: 10
    desc: "输入尾款金额（el-input-number）"
    action: fill
    target: "尾款金额"
    value: "${TAIL_AMOUNT}"

  - step: 11
    desc: "选择预售截止时间（el-date-picker datetime）"
    action: el_date
    target: "预售截止时间"
    value: "${PRESALE_END_TIME}"
    wait_after:
      type: time
      duration: 800

  - step: 12
    desc: "输入限购数量（el-input-number）"
    action: fill
    target: "限购数量"
    value: "${LIMIT_QUANTITY}"

  - step: 13
    desc: "输入库存（el-input-number）"
    action: fill
    target: "库存"
    value: "${STOCK}"

  # ===== 演示控件：输入类 =====
  - step: 14
    desc: "输入密码框（el-input password）"
    action: fill
    target: "密码框"
    value: "test123456"

  - step: 15
    desc: "输入邮箱（el-input 带图标）"
    action: fill
    target: "邮箱"
    value: "test@demo.com"

  - step: 16
    desc: "输入手机号（el-input 限长）"
    action: fill
    target: "手机号"
    value: "13800138000"

  - step: 17
    desc: "输入商品描述（el-input textarea）"
    action: fill
    target: "商品描述"
    value: "E2E 文本域测试内容"

  # ===== 演示控件：选择类 =====
  - step: 18
    desc: "选择商品分类（el-select 单选可搜索）"
    action: select_option
    target: "商品分类"
    option: "数码家电"
    wait_after:
      type: time
      duration: 800

  - step: 19
    desc: "选择品牌（el-select 单选）"
    action: select_option
    target: "品牌"
    option: "华为"
    wait_after:
      type: time
      duration: 800

  # ===== 演示控件：单选/复选/开关 =====
  - step: 20
    desc: "选择配送方式（el-radio）"
    action: click
    target: "快递"
    wait_after:
      type: time
      duration: 500

  - step: 21
    desc: "勾选服务保障（el-checkbox）"
    action: click
    target: "正品保障"
    wait_after:
      type: time
      duration: 500

  - step: 22
    desc: "切换上架状态（el-switch）"
    action: click
    target: "上架状态"
    wait_after:
      type: time
      duration: 500

  # ===== 演示控件：评分/日期/时间 =====
  - step: 23
    desc: "点击商品评分（el-rate）"
    action: click
    target: "商品评分"
    wait_after:
      type: time
      duration: 500

  - step: 24
    desc: "选择上架日期（el-date-picker date）"
    action: el_date
    target: "上架日期"
    value: "${ONLINE_DATE}"
    wait_after:
      type: time
      duration: 800

  - step: 25
    desc: "选择每日开售时间（el-time-picker）"
    action: el_date
    target: "每日开售时间"
    value: "09:30:00"
    wait_after:
      type: time
      duration: 800

  - step: 26
    desc: "选择预售开始时间（el-date-picker datetime）"
    action: el_date
    target: "预售开始时间"
    value: "${PRESALE_START_TIME}"
    wait_after:
      type: time
      duration: 800

  # ===== 演示控件：图片上传 =====
  - step: 27
    desc: "上传商品主图（ImageUpload/el-upload）"
    action: el_upload
    target: "商品主图"
    path: "${UPLOAD_FILE}"
    wait_after:
      type: time
      duration: 3000

  # ===== 提交与验证 =====
  - step: 28
    desc: "确认弹窗仍打开（防止弹窗意外关闭后错点其他按钮）"
    action: wait_for
    target: "确 定"
    timeout_ms: 5000
    wait_after:
      type: time
      duration: 500

  - step: 29
    desc: "提交表单（点确定）"
    action: click
    target: "确 定"
    assertion:
      type: toast_visible
      expected: "新增成功"

  - step: 30
    desc: "校验新增接口（网络层）"
    action: verify_network
    assertion:
      type: network_called
      url_pattern: "/api/presale/goods"
      method: POST
      response_code: 200

  - step: 31
    desc: "确认列表出现新商品"
    action: wait_for
    target: "${GOODS_TITLE}"
    timeout_ms: 8000
    wait_after:
      type: time
      duration: 2000
    assertion:
      type: text_contains
      expected: "${GOODS_TITLE}"

teardown:
  - action: screenshot
    name: "presale-200-components-result.png"
